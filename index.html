<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Center Room Schedule</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100vh;
      max-width: 100%;
      border-radius: 0; /* Full edge-to-edge on mobile */
      background: #fff;
    }
    /* Add subtle polish on larger screens */
    @media (min-width: 768px) {
      iframe {
        width: 95%;
        height: 90vh;
        max-width: 1200px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      }
    }
  </style>
</head>
<body>

</body>
</html>
